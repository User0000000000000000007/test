<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Series Progress</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #0d0d0d;
      --surface: #1a1a1a;
      --primary: #ffffff;
      --on-primary: #0384c0;
      --text: #cccccc;
      --border: #333333;
      --checkbox-border: #888888;
      --progress-bg: rgba(255, 255, 255, 0.05);
      --progress-fill: rgba(255, 255, 255, 0.15);
      --progress-fill-completed: rgba(79, 195, 247, 0.15);
      --progress-fill-highlight: rgb(0 176 255 / 35%);
    }

    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: var(--background);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
      min-height: 100vh;
    }

    .task-container {
      background-color: var(--surface);
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .task-container h2 {
      color: var(--text);
      font-weight: 500;
      font-size: 24px;
      margin-bottom: 24px;
    }

    .task {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background-color: var(--progress-bg);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .task::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: var(--progress-width);
      background-color: var(--progress-fill);
      z-index: 0;
      transition: 500ms cubic-bezier(0, -0.7, 0.25, 1.2);
    }

    .task.highlighted::before {
      background-color: var(--progress-fill-highlight);
    }

    .task-content {
      display: flex;
      align-items: center;
      z-index: 1;
    }

    .radio-button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid var(--checkbox-border);
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 16px;
    }

    .radio-button.ticked {
      border-color: var(--primary);
      background-color: var(--primary);
    }

    .radio-button.ticked::after {
      content: '';
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: var(--on-primary);
    }

    .task span {
      font-size: 16px;
    }

    .percentage {
      z-index: 1;
      font-size: 14px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="task-container">
    <h2>Series Progress</h2>
    <div id="seriesList"></div>
  </div>

  <script>
    const tasksData = [
      "p1-1,,পদার্থবিজ্ঞানের ধারণা,,4",
      "p1-2,,মাত্রা ও একক,,10",
      "p1-3,,ত্রুটি নির্ণয়,,17",
      "p1-4,,ভার্নিয়ার স্কেল, স্ক্র-গজ, স্পেরোমিটার,,11",


      "p2-1,,Checked stock,,300", "p2-2,,Read article,,250",
      "b1-1,,Write blog,,600", "b2-1,,Research topic,,400",
      "x1-1,,Experiment,,700"
    ];

    const storage = JSON.parse(localStorage.getItem('taskCompletionState')) || {};

    const tasks = tasksData.map(item => {
      const [id, name, score] = item.split(',,');
      return {
        id,
        name,
        score: parseInt(score),
        completed: storage[id] === 1
      };
    });

    // Grouping by series letter
    const seriesMap = {};
    tasks.forEach(task => {
      const seriesKey = task.id.charAt(0); // "p", "b", etc.
      if (!seriesMap[seriesKey]) {
        seriesMap[seriesKey] = { total: 0, completed: 0 };
      }
      seriesMap[seriesKey].total += task.score;
      if (task.completed) {
        seriesMap[seriesKey].completed += task.score;
      }
    });

    const seriesNames = {
      p: "Physics first Paper",
      b: "B series",
      x: "X series"
    };

    const seriesList = document.getElementById('seriesList');

    for (const key in seriesMap) {
  const total = seriesMap[key].total;
  const completed = seriesMap[key].completed;
  const percent = total === 0 ? 0 : (completed / total) * 100;
  const isPassed = percent > 40;

  const taskElement = document.createElement('div');
  taskElement.className = 'task';
  taskElement.setAttribute(`onclick`,`window.open("${key}.html");`);
  taskElement.style.setProperty('--progress-width', `0%`);
  setTimeout(() => {taskElement.style.setProperty('--progress-width', `${percent}%`);}, 10);

  if (percent > 70) {
    taskElement.classList.add('highlighted');
  }

  taskElement.innerHTML = `
    <div class="task-content">
      <div class="radio-button ${isPassed ? 'ticked' : ''}"></div>
      <span>${seriesNames[key] || key.toUpperCase() + " series"}</span>
    </div>
    <div class="percentage">${percent.toFixed(1)}%</div>
  `;
  seriesList.appendChild(taskElement);
}
setInterval(`if(localStorage.dov == 1){localStorage.dov = 0;window.location.reload();}`,1);
  </script>
</body>
</html>
